<main class="ui-page account" *ngIf="facade as f">
  <div class="account__state" *ngIf="f.loading"><span class="ui-skeleton"></span><span class="ui-skeleton"></span></div>

  <ng-container *ngIf="!f.loading && f.account as account">
    <div>
      <a class="account__back" routerLink="/purchases"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Proveedores</a>
      <header class="ui-page-head account__head">
        <div class="account__who">
          <ui-avatar [name]="account.supplierName" [key]="f.supplierId" [size]="52"></ui-avatar>
          <div>
            <h1>{{ account.supplierName }}</h1>
            <div class="account__meta">
              <span *ngIf="account.phone">Tel. {{ account.phone }}</span>
              <span *ngIf="account.email">{{ account.email }}</span>
            </div>
          </div>
        </div>
        <div class="account__actions">
          <button uiBtn="ghost" type="button" (click)="f.addCompra()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Agregar compra
          </button>
          <button *ngIf="f.auth.hasPermission(f.permissionCodes.purchasesCreditNoteCreate)" uiBtn="secondary" type="button" (click)="f.toggleCreditNoteForm()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/></svg>Nota de crédito
          </button>
          <button *ngIf="f.auth.hasPermission(f.permissionCodes.purchasesPay)" uiBtn="primary" size="lg" type="button" (click)="f.openPayment()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/><path d="M3 7l12-4v4"/><circle cx="16.5" cy="13.5" r="1.2"/></svg>Registrar pago
          </button>
        </div>
      </header>
    </div>

    <app-account-summary
      [pending]="account.saldoPendiente" [total]="account.deudaTotal" [paid]="account.pagadoTotal" [favor]="account.saldoAFavor"
      pendingHint="Importe pendiente de cancelación" paidLabel="Pagado" favorHint="Disponible para próximas compras"
      [totalHint]="f.compras.length + (f.compras.length === 1 ? ' compra registrada' : ' compras registradas')"
      [paidHint]="f.pagos.length + (f.pagos.length === 1 ? ' pago registrado' : ' pagos registrados')">
    </app-account-summary>

    <app-account-ledger
      [ledger]="f.ledger" [loading]="f.ledgerLoading" [labels]="f.ledgerLabels" [query]="f.ledgerQuery" [busyRowId]="f.busyRowId"
      [canPay]="f.auth.hasPermission(f.permissionCodes.purchasesPay)"
      [canCancelPayments]="f.auth.hasPermission(f.permissionCodes.purchasesCancel)"
      [canCancelCreditNotes]="f.auth.hasPermission(f.permissionCodes.purchasesCreditNoteCancel)"
      (queryChange)="f.onLedgerQueryChange($event)" (paySelected)="f.openPayment($event)"
      (cancelRow)="f.cancelRow($event)" (printRow)="f.printRow($event)" (openDocument)="f.goToCompra($event.id)">
    </app-account-ledger>

    <app-account-credit-note-modal *ngIf="f.showCreditNoteForm"
      heading="Registrar nota de crédito"
      sub="Baja lo que le debemos al proveedor sin registrar un pago. Se imputa sobre las compras pendientes más viejas."
      reasonPlaceholder="Bonificación del proveedor, error de facturación, diferencia de precio..."
      linkLabel="Compra asociada" linkPlaceholder="Sin compra asociada" linkSearchPlaceholder="Buscar compra..."
      submitLabel="Registrar nota de crédito" submittingLabel="Registrando..."
      [amount]="f.ncAmount" [date]="f.ncDate" [reason]="f.ncReason" [saleId]="f.ncPurchaseId" [saleOptions]="f.creditNotePurchaseOptions"
      [canSubmit]="f.canSubmitCreditNote" [submitting]="f.addingCreditNote"
      (amountChange)="f.ncAmount = $event" (dateChange)="f.ncDate = $event" (reasonChange)="f.ncReason = $event" (saleIdChange)="f.ncPurchaseId = $event"
      (submitted)="f.submitCreditNote()" (closed)="f.toggleCreditNoteForm()">
    </app-account-credit-note-modal>

    <app-grouped-payment-modal *ngIf="f.paymentOpen"
      mode="supplier" [counterpartyName]="account.supplierName" [pending]="f.ledger?.pending ?? []" [targetAmount]="f.paymentTarget"
      [carteraCheques]="f.carteraCheques" [banks]="f.chequeBanks" [optionsLoading]="f.carteraLoading" [submitting]="f.submittingPayment"
      (submitted)="f.submitPaymentOrder($event)" (closed)="f.closePayment()">
    </app-grouped-payment-modal>
  </ng-container>
</main>
