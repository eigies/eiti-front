<div class="invoicing-control">
  <label class="toggle-check" *ngIf="showToggle">
    <input type="checkbox" [checked]="requested" (change)="toggle($event)" />
    <span class="toggle-check__track"></span>
    <span class="toggle-check__text">{{ requested ? 'Emitir factura' : 'No facturar' }}</span>
  </label>
  <span class="invoicing-control__auto" *ngIf="!showToggle">Automatica</span>
  <app-invoice-letter-switch *ngIf="willInvoice && !missingPointOfSale" [letter]="letter"
                             (letterChange)="letterChange.emit($event)"></app-invoice-letter-switch>
  <span class="invoicing-control__warn" *ngIf="willInvoice && missingPointOfSale"
        title="Asignale un punto de venta de ARCA en Empresa → Facturación electrónica para poder facturar">Sucursal sin punto de venta</span>
</div>
