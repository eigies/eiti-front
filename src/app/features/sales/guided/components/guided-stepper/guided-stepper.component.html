<ol class="gs" aria-label="Pasos de la venta">
  <li *ngFor="let label of labels; let i = index" class="gs__item" [class.is-done]="i + 1 < step" [class.is-current]="i + 1 === step">
    <button type="button" class="gs__btn" [disabled]="i + 1 > step" [attr.aria-current]="i + 1 === step ? 'step' : null" (click)="jump.emit(i + 1)">
      <span class="gs__dot" aria-hidden="true">
        <svg *ngIf="i + 1 < step; else num" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>
        <ng-template #num>{{ i + 1 }}</ng-template>
      </span>
      <span class="gs__label">{{ title(label) }}</span>
    </button>
  </li>
</ol>
