<main class="ui-page sup">
  <header class="sup__head">
    <div>
      <span class="sup__crumb">Productos</span>
      <h1>Categorías de producto</h1>
      <p>Para agrupar el catálogo y filtrar los reportes.</p>
    </div>
    <button uiBtn="primary" type="button" (click)="openCreate()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nueva categoría
    </button>
  </header>

  <section class="ui-card sup__card">
    <header class="sup__bar">
      <h2>Categorías <span class="ui-count" *ngIf="!loading">{{ filteredCategories.length }}</span></h2>
      <label class="ui-search sup__search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="ui-sr-only">Buscar categoría</span>
        <input class="ui-input" type="search" placeholder="Nombre" [(ngModel)]="searchQuery" />
      </label>
    </header>

    <div class="sup__state" *ngIf="loading"><span class="ui-skeleton"></span><span class="ui-skeleton"></span></div>

    <div class="sup__state" *ngIf="!loading && filteredCategories.length === 0">
      <ui-empty [icon]="searchQuery ? 'search' : 'list'" [heading]="searchQuery ? 'Ninguna categoría coincide' : 'Todavía no hay categorías'" [text]="searchQuery ? 'Probá con otro nombre.' : 'Creá la primera con Nueva categoría.'"></ui-empty>
    </div>

    <div class="ui-table-wrap sup__table-wrap" *ngIf="!loading && filteredCategories.length > 0">
      <table class="ui-table">
        <thead><tr><th>Categoría</th><th><span class="ui-sr-only">Acciones</span></th></tr></thead>
        <tbody>
          <tr *ngFor="let c of filteredCategories">
            <td><span class="sup__who"><ui-avatar [name]="c.name" [key]="c.id" [size]="32"></ui-avatar><strong>{{ c.name }}</strong></span></td>
            <td class="sup__actions">
              <button uiBtn="ghost" size="sm" type="button" (click)="openEdit(c)">Editar</button>
              <button uiBtn="ghost" size="sm" type="button" class="sup__danger" [disabled]="deleting === c.id" (click)="confirmDelete(c)">{{ deleting === c.id ? 'Eliminando…' : 'Eliminar' }}</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<ui-modal *ngIf="showModal" size="sm" [eyebrow]="editingCategory ? 'Edición' : 'Alta'" [heading]="editingCategory ? 'Editar categoría' : 'Nueva categoría'" [closable]="!saving" (closed)="closeModal()">
  <form id="category-form" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <label class="ui-field" [class.ui-field--error]="isInvalid('name')">
      <span class="ui-field__label">Nombre</span>
      <input class="ui-input" type="text" formControlName="name" placeholder="Batería automotor" />
      <span class="ui-field__error" *ngIf="isInvalid('name')">Falta el nombre</span>
    </label>
  </form>
  <footer uiModalFoot class="ui-modal__foot">
    <button uiBtn="secondary" type="button" [disabled]="saving" (click)="closeModal()">Cancelar</button>
    <button uiBtn="primary" type="submit" form="category-form" [disabled]="saving">{{ saving ? 'Guardando...' : (editingCategory ? 'Guardar cambios' : 'Crear categoría') }}</button>
  </footer>
</ui-modal>
