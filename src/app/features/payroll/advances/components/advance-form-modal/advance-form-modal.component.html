<ui-modal eyebrow="Sueldos" heading="Nuevo adelanto" [closable]="!saving" (closed)="closed.emit()">
  <form id="advance-form" class="pm" [formGroup]="form" (ngSubmit)="submitted.emit()" novalidate>
    <div class="pm__grid">
      <label class="ui-field pm__wide">
        <span class="ui-field__label">Empleado</span>
        <app-searchable-select formControlName="employeeId" [options]="employeeOptions" placeholder="Seleccionar empleado" searchPlaceholder="Buscar empleado..."></app-searchable-select>
      </label>
      <label class="ui-field">
        <span class="ui-field__label">Monto</span>
        <input class="ui-input ui-input--num" type="number" min="0.01" step="0.01" formControlName="amount" />
      </label>
      <label class="ui-field">
        <span class="ui-field__label">Fecha</span>
        <input class="ui-input" type="date" formControlName="date" />
      </label>
      <label class="ui-field">
        <span class="ui-field__label">Medio de pago</span>
        <app-searchable-select formControlName="paymentMethod" [options]="paymentMethods" placeholder="Seleccionar medio" searchPlaceholder="Buscar medio..."></app-searchable-select>
      </label>
      <label class="ui-field" *ngIf="usesCash">
        <span class="ui-field__label">Caja abierta</span>
        <app-searchable-select formControlName="cashDrawerId" [options]="cashDrawerOptions" placeholder="Seleccionar caja" searchPlaceholder="Buscar caja..."></app-searchable-select>
      </label>
      <label class="ui-field pm__wide">
        <span class="ui-field__label">Notas <em>(opcional)</em></span>
        <input class="ui-input" type="text" formControlName="notes" />
      </label>
    </div>
    <div class="ui-banner ui-banner--warning" *ngIf="usesCash && cashDrawerOptions.length === 0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <span>No hay cajas abiertas disponibles.</span>
    </div>
  </form>
  <footer uiModalFoot class="ui-modal__foot">
    <button uiBtn="ghost" type="button" [disabled]="saving" (click)="closed.emit()">Cancelar</button>
    <button uiBtn="primary" type="submit" form="advance-form" [disabled]="form.invalid || saving">{{ saving ? 'Guardando...' : 'Crear adelanto' }}</button>
  </footer>
</ui-modal>
