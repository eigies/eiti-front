<ui-modal size="sm" eyebrow="Concepto" [heading]="withPercentage ? 'Editar concepto de descuento' : 'Editar concepto de bonificación'" [closable]="!saving" (closed)="closed.emit()">
  <form id="concept-edit-form" class="pm" [formGroup]="form" (ngSubmit)="submitted.emit()" novalidate>
    <div class="pm__grid" [class.pm__grid--one]="!withPercentage">
      <label class="ui-field">
        <span class="ui-field__label">Nombre</span>
        <input class="ui-input" type="text" maxlength="150" formControlName="name" />
      </label>
      <label class="ui-field" *ngIf="withPercentage">
        <span class="ui-field__label">Porcentaje</span>
        <input class="ui-input ui-input--num" type="number" step="0.01" min="0" max="100" formControlName="percentage" />
      </label>
    </div>
  </form>
  <footer uiModalFoot class="ui-modal__foot">
    <button uiBtn="ghost" type="button" (click)="closed.emit()">Cancelar</button>
    <button uiBtn="primary" type="submit" form="concept-edit-form" [disabled]="form.invalid || saving">Guardar</button>
  </footer>
</ui-modal>
