<section class="ui-card concepts">
  <form *ngIf="canManage && createForm" class="concepts__create" [class.concepts__create--pct]="withPercentage" [formGroup]="createForm" (ngSubmit)="create.emit()">
    <label class="ui-field">
      <span class="ui-field__label">Nombre</span>
      <input class="ui-input" type="text" maxlength="150" [placeholder]="namePlaceholder" formControlName="name" />
    </label>
    <label class="ui-field" *ngIf="withPercentage">
      <span class="ui-field__label">Porcentaje</span>
      <input class="ui-input ui-input--num" type="number" step="0.01" min="0" max="100" formControlName="percentage" />
    </label>
    <button class="ui-btn ui-btn--primary" type="submit" [disabled]="createForm.invalid || savingCreate">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      {{ savingCreate ? 'Guardando...' : 'Crear concepto' }}
    </button>
  </form>

  <div class="concepts__empty" *ngIf="concepts.length === 0">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <strong>No hay conceptos registrados</strong>
  </div>

  <table class="ui-table concepts__table" *ngIf="concepts.length > 0">
    <thead>
      <tr><th>Concepto</th><th class="is-num" *ngIf="withPercentage">Porcentaje</th><th>Estado</th><th><span class="ui-sr-only">Acciones</span></th></tr>
    </thead>
    <tbody>
      <tr class="concept-item" *ngFor="let view of concepts; trackBy: trackById">
        <td class="ui-table__main concept-row__name">{{ view.concept.name }}</td>
        <td class="is-num" *ngIf="withPercentage">{{ view.concept.percentage | number:'1.2-2' }}%</td>
        <td>
          <button
            *ngIf="canManage; else staticBadge"
            type="button"
            class="ui-badge concepts__state"
            [class.ui-badge--success]="view.concept.isActive"
            [disabled]="savingToggle"
            [attr.aria-label]="(view.concept.isActive ? 'Desactivar ' : 'Activar ') + view.concept.name"
            title="Tocá para cambiar el estado"
            (click)="toggleActive.emit(view)">
            {{ view.concept.isActive ? 'Activo' : 'Inactivo' }}
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5-5 5 5M7 14l5 5 5-5"/></svg>
          </button>
          <ng-template #staticBadge>
            <span class="ui-badge" [class.ui-badge--success]="view.concept.isActive">{{ view.concept.isActive ? 'Activo' : 'Inactivo' }}</span>
          </ng-template>
        </td>
        <td class="concepts__actions">
          <button *ngIf="canManage" class="ui-btn ui-btn--ghost ui-btn--sm" type="button" (click)="edit.emit(view)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Editar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
