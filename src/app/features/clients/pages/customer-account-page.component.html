<main class="ui-page account" *ngIf="facade as f">
  <div class="account__state" *ngIf="f.loading"><span class="ui-skeleton"></span><span class="ui-skeleton"></span></div>

  <ng-container *ngIf="!f.loading && f.account as account">
    <div>
      <a class="account__back" routerLink="/clients-cc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Cuentas corrientes</a>
      <header class="ui-page-head account__head">
        <div class="account__who">
          <ui-avatar [name]="account.customerName" [key]="account.customerId" [size]="52"></ui-avatar>
          <div>
            <h1>{{ account.customerName }}</h1>
            <div class="account__meta">
              <span *ngIf="account.phone">Tel. {{ account.phone }}</span>
              <span *ngIf="account.email">{{ account.email }}</span>
            </div>
          </div>
        </div>
        <div class="account__actions">
          <button *ngIf="f.auth.hasPermission(f.permissionCodes.salesCreditNoteCreate)" uiBtn="secondary" type="button" (click)="f.toggleCreditNoteForm()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/></svg>Nota de crédito
          </button>
          <button *ngIf="f.auth.hasPermission(f.permissionCodes.salesPay)" uiBtn="primary" size="lg" type="button" (click)="f.openPayment()">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/><path d="M3 7l12-4v4"/><circle cx="16.5" cy="13.5" r="1.2"/></svg>Registrar cobro
          </button>
        </div>
      </header>
    </div>

    <app-account-summary
      [pending]="account.saldoPendiente" [total]="account.deudaTotal" [paid]="account.cobradoTotal" [favor]="account.saldoAFavor"
      [totalHint]="f.ventas.length + (f.ventas.length === 1 ? ' venta registrada' : ' ventas registradas')"
      [paidHint]="f.cobros.length + (f.cobros.length === 1 ? ' cobro registrado' : ' cobros registrados')">
    </app-account-summary>

    <app-account-ledger
      [ledger]="f.ledger" [loading]="f.ledgerLoading" [labels]="f.ledgerLabels" [query]="f.ledgerQuery" [busyRowId]="f.busyRowId"
      [canPay]="f.auth.hasPermission(f.permissionCodes.salesPay)"
      [canCancelPayments]="f.auth.hasPermission(f.permissionCodes.salesPay)"
      [canCancelCreditNotes]="f.auth.hasPermission(f.permissionCodes.salesCreditNoteCancel)"
      (queryChange)="f.onLedgerQueryChange($event)" (paySelected)="f.openPayment($event)"
      (cancelRow)="f.cancelRow($event)" (printRow)="f.printRow($event)" (openDocument)="f.openDetalle($event.id)">
    </app-account-ledger>

    <app-account-credit-note-modal *ngIf="f.showCreditNoteForm"
      [amount]="f.ncAmount" [date]="f.ncDate" [reason]="f.ncReason" [saleId]="f.ncSaleId" [saleOptions]="f.creditNoteSaleOptions"
      [canSubmit]="f.canSubmitCreditNote" [submitting]="f.addingCreditNote"
      (amountChange)="f.ncAmount = $event" (dateChange)="f.ncDate = $event" (reasonChange)="f.ncReason = $event" (saleIdChange)="f.ncSaleId = $event"
      (submitted)="f.submitCreditNote()" (closed)="f.toggleCreditNoteForm()">
    </app-account-credit-note-modal>

    <app-grouped-payment-modal *ngIf="f.paymentOpen"
      mode="customer" [counterpartyName]="account.customerName" [pending]="f.ledger?.pending ?? []" [targetAmount]="f.paymentTarget"
      [banks]="f.banks" [optionsLoading]="f.banksLoading" [submitting]="f.submittingPayment"
      (submitted)="f.submitReceipt($event)" (closed)="f.closePayment()">
    </app-grouped-payment-modal>
  </ng-container>

  <app-cc-sale-detail-modal *ngIf="f.detalleModalOpen"
    [sale]="f.detalleModalSale" [loading]="f.detalleLoading" [statusLabel]="f.detalleStatusLabel" [statusClass]="f.detalleStatusClass"
    [flags]="detailFlags" [canceling]="f.cancelingSale" [escapeCloses]="!f.cancelModalOpen"
    (closed)="f.closeDetalle()" (downloadPriced)="f.descargarComprobante()" (downloadRemito)="f.descargarRemitoTraslado()"
    (downloadFiscal)="f.downloadDetalleFiscalPdf($event)" (downloadReceipts)="f.downloadAllSaleReceipts()"
    (notesSaved)="f.onDetalleNotesSaved($event)" (cancelSale)="f.openCancelModal()">
  </app-cc-sale-detail-modal>

  <app-cancel-cc-sale-modal *ngIf="f.cancelModalOpen"
    [saleCode]="f.detalleModalSale?.code ?? null" [canceling]="f.cancelingSale" [notice]="f.cancelInvoicingNotice"
    [hasPayments]="f.detalleHasCobros" [paidTotal]="f.detalleCcPaidTotal" [refundMode]="f.cancelRefundMode"
    (refundModeChange)="f.setCancelRefundMode($event)" (confirmed)="f.confirmCancelSale()" (closed)="f.closeCancelModal()">
  </app-cancel-cc-sale-modal>
</main>
