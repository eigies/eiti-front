<ui-modal
  tone="danger"
  size="sm"
  [irreversible]="true"
  [showClose]="false"
  heading="¿Eliminar este producto?"
  [sub]="product.brand + ' / ' + product.name + ' · ' + product.code"
  (closed)="closed.emit()">
  <footer uiModalFoot class="ui-modal__foot">
    <button uiBtn="ghost" type="button" (click)="closed.emit()">Cancelar</button>
    <button uiBtn="danger" type="button" [disabled]="deleting" (click)="confirmed.emit()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
      {{ deleting ? 'Eliminando...' : 'Confirmar eliminación' }}
    </button>
  </footer>
</ui-modal>
