<div class="admin">
  <nav class="admin__nav" aria-label="Administración">
    <span class="admin__title">Administración</span>
    <div class="admin__group" *ngFor="let group of groups">
      <span class="ui-eyebrow admin__eyebrow">{{ group.label }}</span>
      <a *ngFor="let link of group.links" class="admin__link" [routerLink]="link.link" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{ link.label }}</a>
    </div>
  </nav>
  <div class="admin__content"><router-outlet></router-outlet></div>
</div>
