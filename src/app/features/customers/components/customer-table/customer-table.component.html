<ui-table-wrap>
  <table class="ui-table ct">
    <thead>
      <tr><th>Cliente</th><th>Documento</th><th>Domicilio</th><th><span class="ui-sr-only">Acciones</span></th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of customers; trackBy: trackById">
        <td>
          <div class="ct__client">
            <span class="ct__avatar" [ngClass]="'ct__avatar--' + tone(c)" aria-hidden="true">{{ initial(c) }}</span>
            <div class="ct__who">
              <a class="ui-table__main ct__name" [routerLink]="['/customers', c.id]">{{ c.fullName || c.name }}</a>
              <span class="ct__contact"><span [class.ct__none]="!c.email">{{ c.email || 'Sin email' }}</span> · <span [class.ct__none]="!c.phone">{{ c.phone || 'Sin teléfono' }}</span></span>
            </div>
          </div>
        </td>
        <td class="ui-num ct__doc">{{ document(c) }}</td>
        <td class="ct__addr">{{ address(c) }}</td>
        <td>
          <div class="ct__actions">
            <a uiBtn="secondary" size="sm" [routerLink]="['/clients-cc/customer', c.id]">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/><path d="M3 7l12-4v4"/><circle cx="16.5" cy="13.5" r="1.2"/></svg>Cuenta corriente
            </a>
            <a uiBtn="ghost" size="sm" [routerLink]="['/customers', c.id]">Ver</a>
            <button uiBtn="ghost" size="sm" [iconOnly]="true" type="button" [attr.aria-label]="'Editar ' + (c.fullName || c.name)" (click)="edit.emit(c)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
            </button>
            <button *ngIf="canDelete" uiBtn="danger-ghost" size="sm" [iconOnly]="true" type="button" [disabled]="deletingId === c.id" [attr.aria-label]="'Eliminar ' + (c.fullName || c.name)" (click)="remove.emit(c)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</ui-table-wrap>
