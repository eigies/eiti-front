<!-- Barra superior: solo en tablet y celular -->
<header class="topbar">
  <button class="topbar__menu" type="button" [attr.aria-expanded]="sidebarOpen" aria-label="Abrir menú" (click)="toggleSidebar()">
    <svg aria-hidden="true"><use href="assets/icons/nav.svg#menu"></use></svg>
  </button>
  <a class="topbar__brand" routerLink="/dashboard" aria-label="Inicio">
    <img [src]="brandIcon" alt="" width="28" height="28">
    <span>EITI</span>
  </a>
  <span class="topbar__company">{{ companyName }}</span>
</header>

<div class="nav-backdrop" [class.is-visible]="sidebarOpen" (click)="closeSidebar()" aria-hidden="true"></div>

<aside class="nav" [class.is-open]="sidebarOpen" [class.is-rail]="rail" aria-label="Menú principal">
  <div class="nav__head">
    <a class="nav__brand" routerLink="/dashboard" title="Inicio">
      <img [src]="brandIcon" alt="" width="32" height="32">
      <span class="nav__brand-copy">
        <strong>EITI</strong>
        <small>{{ companyName }}</small>
      </span>
    </a>
    <button class="nav__icon-btn nav__rail-btn" type="button" (click)="toggleRail()"
      [attr.aria-label]="rail ? 'Agrandar menú' : 'Achicar menú'" [attr.title]="rail ? 'Agrandar menú' : 'Achicar menú'">
      <svg aria-hidden="true"><use href="assets/icons/nav.svg#rail"></use></svg>
    </button>
    <button class="nav__icon-btn nav__close-btn" type="button" (click)="closeSidebar()" aria-label="Cerrar menú">
      <svg aria-hidden="true"><use href="assets/icons/nav.svg#close"></use></svg>
    </button>
  </div>

  <nav class="nav__body">
    <section class="nav__group" *ngFor="let group of groups; trackBy: trackByLabel">
      <span class="nav__group-label" *ngIf="group.label">{{ group.label }}</span>
      <ng-container *ngFor="let item of group.items; trackBy: trackByLabel">
        <a class="nav__item" [routerLink]="linkOf(item)" [class.is-active]="isActive(item)" [attr.title]="rail ? item.label : null"
          [attr.aria-current]="isActive(item) ? 'page' : null">
          <svg class="nav__icon" aria-hidden="true"><use [attr.href]="'assets/icons/nav.svg#' + item.icon"></use></svg>
          <span class="nav__label">{{ item.label }}</span>
          <svg *ngIf="item.children && item.children.length > 1" class="nav__chevron" aria-hidden="true"><use href="assets/icons/nav.svg#chevron"></use></svg>
        </a>
        <div class="nav__children" *ngIf="isActive(item) && item.children && item.children.length > 1">
          <a *ngFor="let child of item.children; trackBy: trackByLabel" class="nav__child" [routerLink]="child.link"
            [class.is-active]="isChildActive(child)">{{ child.label }}</a>
        </div>
      </ng-container>
    </section>
  </nav>

  <footer class="nav__foot" *ngIf="auth.currentUser as user">
    <a class="nav__user" routerLink="/profile" [class.is-active]="url.startsWith('/profile')" title="Mi cuenta">
      <span class="nav__avatar">{{ user.username.charAt(0).toUpperCase() }}</span>
      <span class="nav__user-copy">
        <strong>{{ user.username }}</strong>
        <small>Mi cuenta</small>
      </span>
    </a>
    <div class="nav__foot-actions">
      <button class="nav__icon-btn" type="button" (click)="theme.toggleTheme()"
        [attr.aria-label]="theme.isDarkTheme ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [attr.title]="theme.isDarkTheme ? 'Modo claro' : 'Modo oscuro'">
        <svg aria-hidden="true"><use [attr.href]="'assets/icons/nav.svg#' + (theme.isDarkTheme ? 'sun' : 'moon')"></use></svg>
      </button>
      <button class="nav__icon-btn nav__logout" type="button" (click)="logout()" title="Salir" aria-label="Salir">
        <svg aria-hidden="true"><use href="assets/icons/nav.svg#logout"></use></svg>
      </button>
    </div>
  </footer>
</aside>
