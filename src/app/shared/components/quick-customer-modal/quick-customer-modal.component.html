<div class="modal-backdrop" (click)="cancel.emit()">
  <div class="modal" (click)="$event.stopPropagation()" [formGroup]="form">
    <h3>Crear cliente</h3>
    <p class="hint">Este presupuesto era para un cliente sin cuenta cargada. Completa los datos para poder convertirlo a venta.</p>

    <label class="field">
      <span class="field__label">Nombre</span>
      <input class="control" type="text" formControlName="firstName" [class.is-invalid]="isInvalid('firstName')">
    </label>

    <label class="field">
      <span class="field__label">Apellido</span>
      <input class="control" type="text" formControlName="lastName">
    </label>

    <label class="field">
      <span class="field__label">Telefono</span>
      <input class="control" type="text" formControlName="phone">
    </label>

    <button type="button" class="billing-toggle" *ngIf="!billingOpen" (click)="billingOpen = true">
      + Datos de facturación <span class="optional">(CUIT y condición frente al IVA, opcional)</span>
    </button>

    <div class="billing" *ngIf="billingOpen">
      <div class="field">
        <span class="field__label">Condición frente al IVA</span>
        <app-searchable-select formControlName="ivaCondition" [options]="ivaConditionOptions"
          placeholder="Condición frente al IVA" searchPlaceholder="Buscar condición..."></app-searchable-select>
      </div>
      <label class="field">
        <span class="field__label">CUIT <span class="optional">(opcional)</span></span>
        <input class="control" type="text" inputmode="numeric" autocomplete="off" placeholder="20-30111222-9"
          formControlName="taxId" [class.is-invalid]="taxIdIssue">
        <span class="field__error" role="alert" *ngIf="taxIdIssue as issue">{{ issue }}</span>
      </label>
    </div>

    <div class="modal__actions">
      <button type="button" class="btn btn--ghost" (click)="cancel.emit()">Cancelar</button>
      <button type="button" class="btn" [disabled]="saving || taxIdIssue" (click)="submit()">
        {{ saving ? 'Creando...' : 'Crear y seleccionar' }}
      </button>
    </div>
  </div>
</div>
